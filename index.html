<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyring · Password Vault</title>
<!-- sthapit27ps -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Keyring</h1></div>
    <div class="sp"></div>
    <button class="btn sm" id="theme">Light / Dark</button>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab on" data-t="vault">My Vault</button>
    <button class="tab" data-t="gen">Password Generator</button>
    <button class="tab" data-t="ana">Strength Check</button>
  </div>

  <section id="vault">
    <div>
      <div class="bar"><input id="q" placeholder="Search your accounts…"><button class="btn p" id="add">+ Add password</button></div>
      <div class="chips" id="chips"></div>
      <div style="color:var(--mut);font-size:13px;margin-bottom:12px"><b id="cnt" style="color:var(--ink)">0</b> accounts · <b id="weak" style="color:var(--ink)">0</b> weak</div>
      <div id="list"></div>
    </div>
  </section>

  <section id="gen" class="card hide">
    <h2 style="margin-bottom:14px">Make a strong password</h2>
    <div class="out" id="gout">—</div>
    <div class="meter"><i id="gm"></i></div>
    <div class="row"><span id="gl" style="font-weight:700"></span><span style="color:var(--mut);font-size:13px" id="gt"></span></div>
    <div class="row"><label style="margin:0">Length</label><b id="glen">18</b></div>
    <input type="range" id="len" min="8" max="48" value="18">
    <div class="chk" style="margin:14px 0" id="opts">
      <label style="margin:0;text-transform:none;font-size:14px"><input type="checkbox" id="oU" checked> Uppercase A–Z</label>
      <label style="margin:0;text-transform:none;font-size:14px"><input type="checkbox" id="oL" checked> Lowercase a–z</label>
      <label style="margin:0;text-transform:none;font-size:14px"><input type="checkbox" id="oN" checked> Numbers 0–9</label>
      <label style="margin:0;text-transform:none;font-size:14px"><input type="checkbox" id="oS" checked> Symbols !@#$</label>
      <label style="margin:0;text-transform:none;font-size:14px"><input type="checkbox" id="oA"> Skip look-alikes (0 O l 1)</label>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" id="regen">Generate new</button><button class="btn" id="gcopy">Copy</button><button class="btn" id="gsave">Save to vault</button><button class="btn" id="gcheck">Analyze it</button></div>
  </section>

  <section id="ana" class="card hide">
    <h2 style="margin-bottom:6px">How strong is your password?</h2>
    <p style="color:var(--mut);margin:0 0 12px">Checked right here in your browser. Nothing is sent anywhere.</p>
    <div class="pwbox"><input id="ain" type="text" placeholder="Type or paste a password" autocomplete="off"><button class="btn" id="ashow">Hide</button></div>
    <div class="meter"><i id="am"></i></div>
    <div class="row"><span id="al" style="font-weight:700">—</span><span style="color:var(--mut);font-size:13px" id="at"></span></div>
    <div class="chk" id="achk"></div>
    <div id="atips" style="margin-top:14px;color:var(--mut);font-size:14px"></div>
  </section>

  <footer>
    <!-- Put your own links in the two href values below -->
    <div class="soc" style="justify-content:center;margin-bottom:8px">
      <a class="ic" id="liA" href="https://www.linkedin.com/in/YOUR-USERNAME" target="_blank" rel="noopener noreferrer" title="LinkedIn" style="background:#0a66c2"></a>
      <a class="ic" id="ghA" href="https://github.com/YOUR-USERNAME" target="_blank" rel="noopener noreferrer" title="GitHub" style="background:#24292f"></a>
    </div>
    By <b>sthapit27ps</b>
  </footer>
</div>

<dialog id="dlg">
  <h2 id="dt" style="margin-bottom:4px">Add a password</h2>
  <label>Service</label><select id="fS"></select>
  <div id="cw" class="hide"><label>Custom name</label><input id="fC" placeholder="e.g. My Bank"></div>
  <label>Username or email</label><input id="fU" autocomplete="off">
  <label>Password</label>
  <div class="pwbox"><input id="fP" type="text" autocomplete="off"><button class="btn sm" id="fG" title="Suggest a strong one">Suggest</button></div>
  <div class="meter"><i id="fM"></i></div><div id="fL" style="font-size:12px;color:var(--mut)"></div>
  <label>Category</label><select id="fK"></select>
  <label>Note (optional)</label><input id="fN">
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px"><button class="btn" id="fX">Cancel</button><button class="btn p" id="fOk">Save</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
